<div class="stranica">
  <h1>Zahtjev za ponudu</h1>
  <p class="uvod">Odaberite proizvod, vrstu kamena i dimenzije, dodajte u listu i pošaljite upit.</p>

  <form id="forma-stavka">
    <label>Proizvod
      <select id="proizvod" required>
        <option value="">Odaberi</option>
        <option>Stepenice</option>
        <option>Klupica</option>
        <option>Nišan</option>
        <option>Spomenik</option>
        <option>Kamin</option>
        <option>Ostalo</option>
      </select>
    </label>

    <label>Vrsta kamena
      <select id="kamen" required>
        <option value="">Odaberi</option>
        <option>Granit</option>
        <option>Crni granit</option>
        <option>Mramor</option>
        <option>Krečnjak</option>
        <option>Pješčenjak</option>
      </select>
    </label>

    <div class="dimenzije">
      <label>Dužina (cm) <input type="number" id="duzina" min="1" required></label>
      <label>Širina (cm) <input type="number" id="sirina" min="1" required></label>
      <label>Visina (cm) <input type="number" id="visina" min="1" required></label>
    </div>

    <label>Tekst za uklesati (nije obavezno)
      <textarea id="tekst" rows="3"></textarea>
    </label>

    <button type="submit">Dodaj u listu</button>
  </form>

  <h2>Vaša lista</h2>
  <ul id="lista"></ul>

  <form id="forma-upit">
    <label>Ime i prezime <input type="text" id="ime" required></label>
    <label>Telefon <input type="tel" id="telefon" required></label>
    <button type="submit">Pošalji upit</button>
  </form>
</div>
