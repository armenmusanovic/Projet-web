<div class="stranica">
  <h1>Registracija</h1>
  <form id="register-form">
    <label>Ime i prezime <input type="text" id="reg-name" required></label>
    <label>Email <input type="email" id="reg-email" required></label>
    <label>Lozinka <input type="password" id="reg-password" minlength="6" required></label>
    <button type="submit">Registruj se</button>
  </form>
  <p>Već imaš račun? <a href="#login">Prijavi se</a></p>
</div>
